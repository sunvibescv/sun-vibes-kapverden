<style>
/* Layout: a sun-and-ocean hero, then an archipelago map you can click, island by island, framed by quiet text columns */
:root {
  --salt: #f2f5f7;        /* page ground: sea-salt white, cool */
  --surface: #ffffff;
  --ink: #0d2236;         /* deep Atlantic */
  --ink-soft: #4a5d70;
  --sun: #f2c200;         /* the accent: logo yellow */
  --ember: #e2591f;       /* logo's orange-red rim */
  --sun-ink: #2a1d00;     /* text on sun */
  --sea: #1f5f8b;         /* flag blue, links + map water */
  --lava: #2b2522;        /* Fogo basalt, used for the facts band */
  --line: #d5dee6;
  --water: #dce8f0;
  --land: #e9d9b5;
  --land-active: var(--sun);

  --f-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(2rem, 4vw, 2.75rem);
  --step-4: clamp(2.1rem, 4.6vw, 4.2rem);
  --gutter: clamp(16px, 4vw, 48px);
  --max: 1160px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --salt: #0a1824; --surface: #10212f; --ink: #e8eef3; --ink-soft: #9fb2c3;
    --sun: #ffcf1a; --ember: #ff7a3d; --sun-ink: #2a1d00; --sea: #7fbbe3; --lava: #050d14;
    --line: #22384a; --water: #0f2638; --land: #6b5a3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --salt: #0a1824; --surface: #10212f; --ink: #e8eef3; --ink-soft: #9fb2c3;
  --sun: #ffcf1a; --ember: #ff7a3d; --sun-ink: #2a1d00; --sea: #7fbbe3; --lava: #050d14;
  --line: #22384a; --water: #0f2638; --land: #6b5a3a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body {
  background: var(--salt); color: var(--ink);
  font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6;
  padding-inline: var(--gutter);
}
.wrap { max-width: var(--max); margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1, h2 { hyphens: auto; }
p { margin: 0; }
a { color: var(--sea); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

/* Nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; }
.brand img { height: 52px; width: auto; display: block; }
.nav-right { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
.nav-links a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
.nav-links a:hover { color: var(--sea); }
.lang { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px; gap: 2px; }
.lang button { font: 500 0.78rem var(--f-mono); letter-spacing: .08em; color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--salt); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 1rem var(--f-body); padding: 14px 22px; border-radius: 999px; text-decoration: none; border: 2px solid transparent; cursor: pointer; transition: transform .15s ease; }
.btn:hover { transform: translateY(-2px); }
.btn-sun { background: var(--sun); color: var(--sun-ink); }
.btn-ghost { border-color: var(--ink); color: var(--ink); background: transparent; }

/* Hero */
.hero { position: relative; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(24px, 4vw, 56px); align-items: center; padding-block: clamp(28px, 6vw, 72px) clamp(40px, 7vw, 96px); }
.hero h1 { font-size: var(--step-4); font-weight: 800; overflow-wrap: break-word; }
.hero h1 em { font-style: normal; color: var(--ember); background: linear-gradient(100deg, var(--sun) 0%, var(--ember) 90%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-copy { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.hero-lede { font-size: var(--step-1); color: var(--ink-soft); max-width: 36ch; }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
/* empty turquoise beach, framed as an arch */
.hero-art { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero-art img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 60%; border-radius: 999px 999px 24px 24px; display: block; }
.coords { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-soft); }

/* About */
.about { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(24px, 5vw, 64px); align-items: start; }
.about-text { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.about-text h2 { font-size: var(--step-3); }
.about-text p { color: var(--ink-soft); max-width: 58ch; }
.about-text .mission { color: var(--ink); font-weight: 500; font-size: var(--step-1); line-height: 1.45; border-left: 4px solid var(--ember); padding-left: 18px; }
.why { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.why h3 { font-size: var(--step-1); }
.why ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.why li { padding-block: 12px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; }
.why li::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--sun), var(--ember)); transform: translateY(-1px); }

/* Island photos */
.island-photos { display: grid; gap: 8px; margin: -8px -8px 4px; }
.island-photos.two { grid-template-columns: 1fr 1fr; }
.island-photos img { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; display: block; }
.island-photos.two img { aspect-ratio: 3 / 4; }

/* Morabeza: cave-view photo band, always dark */
.morabeza-band { position: relative; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); padding-block: clamp(80px, 14vw, 160px); background: #14181c url("img/cave.jpg") center 55% / cover no-repeat; color: #fff6ea; }
.morabeza-band::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,8,20,.15), rgba(10,8,20,.55)); }
.morabeza-band .wrap { position: relative; }
.morabeza-band p { font-family: var(--f-display); font-weight: 800; font-size: clamp(3rem, 10vw, 7rem); line-height: 1; letter-spacing: -0.02em; text-shadow: 0 2px 30px rgba(0,0,0,.35); }
.morabeza-band small { display: block; font-family: var(--f-body); font-weight: 500; font-size: var(--step-1); line-height: 1.5; letter-spacing: 0; margin-top: 20px; max-width: 44ch; color: #fff6ea; }

/* Services */
section { padding-block: clamp(48px, 8vw, 96px); }
.sec-head { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: end; margin-bottom: 40px; }
.sec-head h2 { font-size: var(--step-3); font-weight: 700; }
.sec-head p { color: var(--ink-soft); max-width: 46ch; }
.services { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); }
.svc { padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); min-width: 0; }
.svc:first-child { padding-left: 0; }
.svc:last-child { border-right: 0; }
.svc h3 { font-size: var(--step-1); font-weight: 700; hyphens: auto; }
.svc p { color: var(--ink-soft); font-size: 0.97rem; }
.svc ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.svc li::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); margin-right: 10px; vertical-align: 2px; }

/* Islands */
.islands { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(24px, 4vw, 48px); align-items: start; }
.map-box { background: var(--water); border-radius: 20px; padding: 12px; min-width: 0; }
.map-box svg { width: 100%; height: auto; display: block; }
.isl { cursor: pointer; }
.isl circle { fill: var(--land); stroke: var(--ink); stroke-opacity: .25; stroke-width: 1.5; transition: fill .2s ease, transform .2s ease; transform-box: fill-box; transform-origin: center; }
.isl text { font-family: var(--f-mono); font-size: 13px; fill: var(--ink); pointer-events: none; }
.isl:hover circle, .isl:focus-visible circle { transform: scale(1.08); }
.isl[aria-pressed="true"] circle { fill: var(--land-active); stroke-opacity: .7; }
.isl:focus-visible { outline: none; }
.isl:focus-visible circle { stroke: var(--sun); stroke-opacity: 1; stroke-width: 3; }
.map-legend { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 8px 2px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-soft); }
.island-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.island-card h3 { font-size: var(--step-2); font-weight: 800; }
.island-card .tag { align-self: flex-start; font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; background: var(--sun); color: var(--sun-ink); padding: 4px 10px; border-radius: 999px; }
.island-card dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0; font-size: 0.93rem; }
.island-card dt { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.island-card dd { margin: 0; font-variant-numeric: tabular-nums; }
.island-card p { color: var(--ink-soft); }
.island-card .btn { align-self: flex-start; }

/* Process */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.step { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.step-n { font-family: var(--f-display); font-weight: 800; font-size: 3.5rem; line-height: 1; color: var(--ember); }
.step h3 { font-size: var(--step-1); }
.step p { color: var(--ink-soft); }
.step .when { font-family: var(--f-mono); font-size: 0.8rem; color: var(--sea); }

/* Facts band: always dark basalt */
.facts { background: var(--lava); color: #f2ede6; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
.facts .eyebrow { color: #b9b0a6; }
.facts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 28px; }
.fact { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #5a4f48; padding-top: 16px; }
.fact b { font-family: var(--f-display); font-size: var(--step-2); font-weight: 700; color: #ffc42e; font-variant-numeric: tabular-nums; }
.fact span { font-size: 0.93rem; color: #d8d0c6; }

/* Contact */
.contact { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(24px, 5vw, 64px); align-items: start; }
.contact-info { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.contact-info h2 { font-size: var(--step-3); }
.contact-info p { color: var(--ink-soft); max-width: 42ch; }
.contact-lines { display: flex; flex-direction: column; gap: 12px; font-family: var(--f-mono); font-size: 0.92rem; }
.cline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.cline .k { color: var(--ink-soft); width: 96px; flex: none; }
.cline .v { overflow-wrap: anywhere; user-select: all; }
.cline a.v { user-select: text; }
.copy { font: 500 0.72rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
.copy:hover { border-color: var(--ink); }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 3vw, 32px); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
label { font-size: 0.85rem; font-weight: 600; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--salt); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--sun); outline-offset: 1px; }
.form-note { grid-column: 1 / -1; font-size: 0.9rem; color: var(--ink-soft); }
.form-ok { grid-column: 1 / -1; background: color-mix(in srgb, var(--sun) 22%, var(--surface)); border-radius: 10px; padding: 14px 16px; font-size: 0.95rem; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

footer { border-top: 1px solid var(--line); padding-block: 28px 40px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 0.88rem; color: var(--ink-soft); }
footer img { height: 72px; width: auto; display: block; }
.foot-meta { display: flex; flex-direction: column; gap: 4px; text-align: right; }

/* Responsive */
@media (max-width: 900px) {
  .hero, .islands, .contact, .sec-head, .about { grid-template-columns: 1fr; }
  .hero-art { max-width: 400px; width: 100%; justify-self: center; }
  .foot-meta { text-align: left; }
  .services { grid-template-columns: 1fr 1fr; }
  .svc, .svc:first-child { border-right: 0; padding-left: 0; border-bottom: 1px solid var(--line); }
  .facts-grid { grid-template-columns: 1fr 1fr; }
  .steps { grid-template-columns: 1fr; gap: 28px; }
}
@media (max-width: 560px) {
  .services, .facts-grid, form { grid-template-columns: 1fr; }
  .nav-links { gap: 14px; }
  .brand img { height: 42px; }
}
</style>
</head>

<div class="wrap">
  <header class="nav">
    <a class="brand" href="#top" id="top"><img src="img/logo-wide.png" alt="Sun Vibes Kapverden" width="720" height="249"></a>

  { id: "sal",         name: "Sal",         x: 534, y: 114, area: 216, group: "Barlavento", town: "Espargos / Santa Maria",
    photos: [
      { src: "sal-heart.jpg", alt: { de: "Ein Herz aus Lavasteinen im Sand am Strand", en: "A heart of lava stones in the beach sand", pt: "Um coração de pedras de lava na areia da praia" } }
    ],
    best: { de: "Strandurlaub & Vermietung", en: "Beach holidays & rentals", pt: "Férias de praia e arrendamento" },
    vibe: { de: "Internationaler Flughafen, der Strand von Santa Maria, Kitesurfen und der stärkste Vermietungsmarkt.",
            en: "International airport, Santa Maria beach, kitesurfing and the strongest rental market.",
            pt: "Aeroporto internacional, a praia de Santa Maria, kitesurf e o mercado de arrendamento mais forte." } },
  { id: "boa-vista",   name: "Boa Vista",   x: 560, y: 240, area: 620, group: "Barlavento", town: "Sal Rei",
    photos: [
      { src: "boavista-turtle.jpg", alt: { de: "Unechte Karettschildkröte am Strand in der Abenddämmerung", en: "Loggerhead turtle on the beach at dusk", pt: "Tartaruga-comum na praia ao entardecer" } },
      { src: "boavista-shipwreck.jpg", alt: { de: "Portugiesische Galeere am Strand, dahinter ein Schiffswrack in der Brandung", en: "Portuguese man o' war on the beach with a shipwreck in the surf behind", pt: "Caravela-portuguesa na praia com um naufrágio na rebentação" } }
    ],
    best: { de: "Resorts & lange Strände", en: "Resorts & long beaches", pt: "Resorts e praias extensas" },
    vibe: { de: "Dünen, Strände mit Schildkrötennestern und große Resorts. Direktflüge aus Europa.",
            en: "Dunes, turtle nesting beaches and large resorts. Direct flights from Europe.",
            pt: "Dunas, praias de desova de tartarugas e grandes resorts. Voos diretos da Europa." } },
  { id: "maio",        name: "Maio",        x: 490, y: 416, area: 269, group: "Sotavento",  town: "Vila do Maio",
    best: { de: "Entschleunigtes Leben", en: "Slow living", pt: "Vida tranquila" },
    vibe: { de: "Ruhige, unberührte Strände und eine kleine Gemeinschaft, nah an der Hauptstadt.",
            en: "Calm, untouched beaches and a small community, close to the capital.",
            pt: "Praias calmas e intactas e uma pequena comunidade, perto da capital." } },
  { id: "santiago",    name: "Santiago",    x: 400, y: 444, area: 991, group: "Sotavento",  town: "Praia",
    best: { de: "Business & Behörden", en: "Business & administration", pt: "Negócios e administração" },
    vibe: { de: "Größte Insel mit der Hauptstadt Praia, Ministerien, Banken und dem UNESCO-Welterbe Cidade Velha.",
            en: "Largest island, home to the capital Praia, ministries, banks and UNESCO-listed Cidade Velha.",
            pt: "A maior ilha, com a capital Praia, ministérios, bancos e a Cidade Velha, Património Mundial da UNESCO." } },
  { id: "fogo",        name: "Fogo",        x: 240, y: 476, area: 476, group: "Sotavento",  town: "São Filipe",
    best: { de: "Abenteuer & Wein", en: "Adventure & wine", pt: "Aventura e vinho" },
    vibe: { de: "Aktiver Vulkan Pico do Fogo (2.829 m), schwarzer Sand und Wein aus dem Krater.",
            en: "Active volcano Pico do Fogo (2,829 m), black sand and wine grown in the crater.",
            pt: "O vulcão ativo Pico do Fogo (2829 m), areia negra e vinho produzido dentro da cratera." } },
  { id: "brava",       name: "Brava",       x: 178, y: 492, area: 64,  group: "Sotavento",  town: "Nova Sintra",
    best: { de: "Totale Auszeit", en: "Total escape", pt: "Fuga total" },
    vibe: { de: "Kleinste bewohnte Insel mit Blumen, Nebel und steilen grünen Hügeln. Nur per Fähre erreichbar.",
            en: "Smallest inhabited island, with flowers, fog and steep green hills. Ferry access only.",
            pt: "A mais pequena ilha habitada, com flores, nevoeiro e colinas verdes íngremes. Acesso apenas por ferry." } }
];

const LOCALE = { de: "de-DE", en: "en-GB", pt: "pt-PT" };
let lang = "de";
let current = "sal";
const t = (k, vars = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function applyLang(next) {
  lang = T[next] ? next : "de";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t(el.dataset.i18nAlt); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  select(current);
  try { localStorage.setItem("svk-lang", lang); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

// Map
const svg = document.getElementById("map");
const card = document.getElementById("card");
const NS = "http://www.w3.org/2000/svg";
ISLANDS.forEach(isl => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "isl");
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", isl.name);
  g.dataset.id = isl.id;
  const r = Math.max(7, Math.sqrt(isl.area) * 1.1);
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", isl.x); c.setAttribute("cy", isl.y); c.setAttribute("r", r);
  const tx = document.createElementNS(NS, "text");
  const right = isl.x < 560;
  tx.setAttribute("x", right ? isl.x + r + 6 : isl.x - r - 6);
  tx.setAttribute("y", isl.y + 4);
  tx.setAttribute("text-anchor", right ? "start" : "end");
  tx.textContent = isl.name;
  g.append(c, tx);
  g.addEventListener("click", () => select(isl.id));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(isl.id); } });
  svg.appendChild(g);
});

const islandSelect = document.getElementById("f-island");
ISLANDS.filter(i => i.id !== "santa-luzia").forEach(i => islandSelect.add(new Option(i.name, i.name)));

function select(id) {
  current = id;
  const isl = ISLANDS.find(i => i.id === id);
  svg.querySelectorAll(".isl").forEach(g => g.setAttribute("aria-pressed", g.dataset.id === id ? "true" : "false"));
  const photos = isl.photos || [];
  card.innerHTML = `
    ${photos.length ? `<div class="island-photos${photos.length > 1 ? " two" : ""}">${photos.map(p => `<img src="img/${p.src}" alt="${esc(p.alt[lang])}" loading="lazy">`).join("")}</div>` : ""}
    <span class="tag">${isl.group}</span>
    <h3>${isl.name}</h3>
    <p>${isl.vibe[lang]}</p>
    <dl>
      <dt>${t("card.best")}</dt><dd>${isl.best[lang]}</dd>
      <dt>${t("card.town")}</dt><dd>${isl.town ?? t("none")}</dd>
      <dt>${t("card.area")}</dt><dd>${isl.area.toLocaleString(LOCALE[lang])} km²</dd>
    </dl>
    ${isl.id === "santa-luzia" ? "" : `<a class="btn btn-ghost" href="#contact">${t("card.cta", { name: isl.name })}</a>`}`;
  const a = card.querySelector("a");
  if (a) a.addEventListener("click", () => { islandSelect.value = isl.name; });
}

// Copy buttons
document.querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", () => {
  const done = () => { btn.textContent = t("c.copied"); setTimeout(() => { btn.textContent = t("c.copy"); }, 1600); };
  const fallback = () => {
    const v = btn.parentElement.querySelector(".v");
    const range = document.createRange(); range.selectNodeContents(v);
    const s = getSelection(); s.removeAllRanges(); s.addRange(range);
  };
  try { navigator.clipboard.writeText(btn.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
}));

// Contact form: builds a ready-to-send WhatsApp message
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim(), email = f.email.value.trim();
  const note = document.getElementById("form-note");
  if (!name || !/^\S+@\S+\.\S+$/.test(email)) {
    note.className = "form-note";
    note.textContent = t("form.err");
    return;
  }
  const msg = t("wa.msg", {
    name, email,
    topic: f.topic.options[f.topic.selectedIndex].text,
    island: f.island.value || t("form.undecided"),
    msg: f.message.value.trim()
  });
  note.className = "form-ok";
  note.innerHTML = `<span>${esc(t("form.ok", { name, email: EMAIL }))}</span>
    <a class="btn btn-sun" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${esc(t("form.wa"))}</a>`;
});

// Start language: saved choice, else browser language, else German
let start = null;
try { start = localStorage.getItem("svk-lang"); } catch (e) {}
if (!T[start]) {
  const nav = (navigator.language || "de").slice(0, 2).toLowerCase();
  start = T[nav] ? nav : "de";
}
applyLang(start);

</script>
